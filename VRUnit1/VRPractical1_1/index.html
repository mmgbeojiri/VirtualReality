<html>
  <head>
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>
  </head>
  <body>
    <a-scene>
      <a-box position="-1 0.5 -3" rotation="0 45 0" color="#4CC3D9"></a-box>
      <a-sphere position="0 1.25 -5" radius="1.25" color="#EF2D5E"></a-sphere>

      <a-box position="1 0.75 -3" wireframe="true" class="tire">
      <a-torus  radius="0.5" radius-tubular="0.1" rotation="0 0 0" color="#111"></a-torus>
      
      <a-cylinder radius="0.1" height="0.707" rotation="0 0 60"></a-cylinder>
      <a-cylinder radius="0.1" height="0.707" rotation="0 0 120"></a-cylinder>
      <a-cylinder radius="0.1" height="0.707" rotation="0 0 180"></a-cylinder>
      <a-cylinder radius="0.025" height="0.2" rotation="90 0 0" position="0 0.1 0" color="#111"></a-cylinder>
      <a-cylinder radius="0.025" height="0.2" rotation="90 0 0" position="0.1 0 0" color="#111"></a-cylinder>
      <a-cylinder radius="0.025" height="0.2" rotation="90 0 0" position="0 -0.1 0" color="#111"></a-cylinder>
      <a-cylinder radius="0.025" height="0.2" rotation="90 0 0" position="-0.1 0 0" color="#111"></a-cylinder>
      </a-box>

      <a-plane position="0 0 -4" rotation="-90 0 0" width="4" height="4" color="#7BC8A4"></a-plane>
      <a-sky color="#ECECEC"></a-sky>
      <a-camera position="0 1.4 5"></a-camera>
    </a-scene>
  </body>
</html>
